services:
  # ------------------------------------------------------------------
  # Frontend builder (Vite / Bootstrap / SCSS) – runs once and exits
  # ------------------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: reposa_frontend
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "npm ci --prefer-offline 2>/dev/null || npm install && npm run build"
    networks:
      - reposa_network

  # ------------------------------------------------------------------
  # Laravel App (PHP-FPM)
  # ------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: reposa_app
    restart: unless-stopped
    entrypoint: ["bash", "/var/www/html/docker/entrypoint.sh"]
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      frontend:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - reposa_network

  # ------------------------------------------------------------------
  # Laravel Queue Worker
  # ------------------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: reposa_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      app:
        condition: service_completed_successfully
    networks:
      - reposa_network

  # ------------------------------------------------------------------
  # Nginx Web Server
  # ------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: reposa_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - reposa_network

  # ------------------------------------------------------------------
  # MySQL 8
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: reposa_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --skip-ssl
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reposaplus
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-u", "root", "-proot", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - reposa_network

  # ------------------------------------------------------------------
  # Redis (caché + colas)
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: reposa_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - reposa_network

  # ------------------------------------------------------------------
  # MailHog (SMTP + Web UI)
  # ------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: reposa_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - reposa_network

volumes:
  mysql_data:
  storage_data:

networks:
  reposa_network:
    driver: bridge
