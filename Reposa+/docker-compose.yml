services:
  # ------------------------------------------------------------------
  # Laravel App (Nginx + PHP-FPM via Supervisor)
  # ------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: reposa_app
    restart: unless-stopped
    entrypoint: ["bash", "/var/www/html/docker/entrypoint.sh"]
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      frontend:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - reposa_network

  # ------------------------------------------------------------------
  # Laravel Queue Worker
  # ------------------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: reposa_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      app:
        condition: service_completed_successfully
    networks:
      - reposa_network

  # ------------------------------------------------------------------
  # Nginx Web Server
  # ------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: reposa_nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - storage_data:/var/www/html/storage
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - reposaplus

  # ------------------------------------------------------------------
  # Load Balancer (Nginx reverse proxy)
  # ------------------------------------------------------------------
  nginx-lb:
    image: nginx:alpine
    container_name: reposaplus_lb
    restart: unless-stopped
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - ./docker/nginx-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - reposaplus

  # ------------------------------------------------------------------
  # Laravel Queue Worker
  # ------------------------------------------------------------------
  queue:
    build:
      context: .
      target: app
    container_name: reposaplus_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - storage_data:/var/www/html/storage
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
    networks:
      - reposaplus

  # ------------------------------------------------------------------
  # MySQL Database
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: reposaplus_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reposaplus
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - reposaplus

  # ------------------------------------------------------------------
  # Redis (Sessions, Cache, Queue)
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: reposaplus_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - reposaplus

  # ------------------------------------------------------------------
  # MailHog (SMTP + Web UI for email testing)
  # ------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: reposaplus_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - reposaplus

  # ------------------------------------------------------------------
  # MinIO (S3-compatible object storage)
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: reposaplus_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - reposa_network

  # ------------------------------------------------------------------
  # MySQL 8
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: reposa_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --skip-ssl
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reposaplus
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-u", "root", "-proot", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - reposa_network

  # ------------------------------------------------------------------
  # Redis (caché + colas)
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: reposa_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - reposa_network

  # ------------------------------------------------------------------
  # MailHog (SMTP + Web UI)
  # ------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: reposa_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - reposa_network

  # ------------------------------------------------------------------
  # Ngrok Skip Warning Proxy (Opcional para túneles y herramientas externas)
  # ------------------------------------------------------------------
  ngrok-proxy:
    image: igops/ngrok-skip-browser-warning:latest
    container_name: reposaplus_ngrok_proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - UPSTREAM=http://nginx-lb:80
      - ADD_HEADER_ACCESS_CONTROL_ALLOW_ORIGIN=*
    depends_on:
      - nginx-lb
    networks:
      - reposaplus
    profiles:
      - tunnel

volumes:
  mysql_data:
  redis_data:
  minio_data:
  storage_data:

networks:
  reposa_network:
    driver: bridge
