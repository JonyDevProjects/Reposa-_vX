services:
  # ------------------------------------------------------------------
  # Laravel App (Nginx + PHP-FPM via Supervisor)
  # ------------------------------------------------------------------
  app:
    build:
      context: .
      target: app
    container_name: reposaplus_app
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - storage_data:/var/www/html/storage
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - reposaplus

  # ------------------------------------------------------------------
  # Load Balancer (Nginx reverse proxy)
  # ------------------------------------------------------------------
  nginx-lb:
    image: nginx:alpine
    container_name: reposaplus_lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - reposaplus

  # ------------------------------------------------------------------
  # Laravel Queue Worker
  # ------------------------------------------------------------------
  queue:
    build:
      context: .
      target: app
    container_name: reposaplus_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - storage_data:/var/www/html/storage
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
    networks:
      - reposaplus

  # ------------------------------------------------------------------
  # MySQL Database
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: reposaplus_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reposaplus
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - reposaplus

  # ------------------------------------------------------------------
  # Redis (Sessions, Cache, Queue)
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: reposaplus_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - reposaplus

  # ------------------------------------------------------------------
  # MailHog (SMTP + Web UI for email testing)
  # ------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: reposaplus_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - reposaplus

  # ------------------------------------------------------------------
  # MinIO (S3-compatible object storage)
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: reposaplus_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - reposaplus

volumes:
  mysql_data:
  redis_data:
  minio_data:
  storage_data:

networks:
  reposaplus:
    driver: bridge
