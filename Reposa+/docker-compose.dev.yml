# Docker Compose — Dev Container (ligero)
#
# Solo app + MySQL para desarrollo diario.
# Código montado desde host → ediciones en tiempo real.
# Redis, queue, mailhog, minio y nginx excluidos.
#
# Uso:
#   Abrir en VS Code → "Reopen in Container"
#   O: docker compose -f docker-compose.dev.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: reposaplus-dev-app
    volumes:
      - .:/var/www/html
      - composer_cache:/root/.composer
    ports:
      - "8000:8000"
    depends_on:
      mysql-dev:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql-dev
      DB_PORT: 3306
      DB_DATABASE: reposaplus_dev
      DB_USERNAME: root
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      FILESYSTEM_DISK: local
      STRIPE_SECRET: ${STRIPE_SECRET:-sk_test_placeholder}
      STRIPE_KEY: ${STRIPE_KEY:-pk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_test_placeholder}
    command: sh -c "sleep infinity"

  mysql-dev:
    image: mysql:8.0
    container_name: reposaplus-dev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: reposaplus_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_dev_data:
  composer_cache:
